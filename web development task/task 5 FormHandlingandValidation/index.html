
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Form Validation</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Contact Us</h1>
        <p class="subtitle">Please fill in the form below.</p>

        <form id="contactForm" novalidate>

            <!-- Name -->
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">
            <small class="error" id="nameError"></small>

            <!-- Email -->
            <label for="email">Email Address</label>
            <input type="text" id="email" placeholder="example@gmail.com">
            <small class="error" id="emailError"></small>

            <!-- Phone -->
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter 10-digit phone number">
            <small class="error" id="phoneError"></small>

            <!-- Message -->
            <label for="message">Message</label>
            <textarea id="message" rows="4"
                placeholder="Write your message"></textarea>
            <small class="error" id="messageError"></small>

            <!-- Submit button -->
            <button type="submit">Submit Form</button>

            <!-- Submission feedback -->
            <p id="successMessage" role="status" aria-live="polite"></p>

        </form>

    </div>

    <!-- Connect JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
