
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WebCraft - Contact</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <nav class="navbar">

            <div class="logo">
                WebCraft
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="services.html">Services</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- ================= CONTACT ================= -->

    <main>

        <section class="page-title">

            <h1>Contact Us</h1>

            <p>
                Get in touch with WebCraft.
            </p>

        </section>


        <section class="contact">

            <div class="contact-info">

                <h2>Contact Information</h2>

                <p>
                    Email: info@webcraft.com
                </p>

                <p>
                    Phone: +91 98765 43210
                </p>

                <p>
                    Location: Mumbai, India
                </p>

            </div>


            <form class="contact-form">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >


                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    rows="5"
                    placeholder="Enter your message"
                ></textarea>


                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 WebCraft. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
